name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  GO_IMAGE: ghcr.io/${{ github.repository }}/go
  PYTHON_IMAGE: ghcr.io/${{ github.repository }}/python

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint Go
        run: |
          cd services/go-api-server
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi
          go vet ./...

      - name: Test Go
        run: |
          cd services/go-api-server
          go test ./...

      - name: Build frontend
        run: |
          cd apps/t3-web-frontend
          npm ci
          npm run build

      - name: Build Docker images
        run: docker compose build

  publish:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go image
        uses: docker/build-push-action@v5
        with:
          context: ./services/go-api-server
          push: true
          tags: ${{ env.GO_IMAGE }}:${{ github.sha }},${{ env.GO_IMAGE }}:latest

      - name: Build and push Python image
        uses: docker/build-push-action@v5
        with:
          context: ./services/python-analytics
          push: true
          tags: ${{ env.PYTHON_IMAGE }}:${{ github.sha }},${{ env.PYTHON_IMAGE }}:latest
