name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - '**'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          # The runner's tool cache can lag behind the newest patch release;
          # govulncheck fails on stdlib CVEs fixed only in that patch.
          check-latest: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Lint Go
        run: |
          cd services/go-api-server
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi
          go vet ./...

      - name: Test Go (unit)
        run: cd services/go-api-server && go test ./...

      - name: Scan Go dependencies for known vulnerabilities
        run: cd services/go-api-server && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test Go (integration)
        run: |
          cd services/go-api-server
          go test -tags=integration ./internal/playback/...
          go test -tags=integration ./internal/auth/...
          go test -tags=integration ./internal/playlists/...
          go test -tags=integration .

      - name: Test web UI
        run: |
          cd apps/web
          npm ci
          # The typed API client must match services/go-api-server/openapi.yaml.
          npm run check:api
          npm test

      - name: Build web UI
        run: |
          cd apps/web
          npm run build

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Test Python analytics
        run: |
          cd services/python-analytics
          grep -v '^essentia' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
          DATABASE_URL=postgres://unused@localhost/unused PYTHONPATH=src pytest -q tests

      - name: Build Docker images
        env:
          DOWNLOAD_GENRE_MODELS: "false"
          # Required by docker-compose.yml interpolation; build-only, never run.
          POSTGRES_PASSWORD: ci-build-only
          ANALYTICS_API_SECRET: ci-build-only-not-a-real-secret
        run: docker compose build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The Kotlin API client is generated from services/go-api-server/openapi.yaml,
      # so a spec change that breaks the app fails here.
      - name: Build, test and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ownwave-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "GO_IMAGE=ghcr.io/${repo}/go" >> $GITHUB_ENV
          echo "PYTHON_IMAGE=ghcr.io/${repo}/python" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Python first: its genre model download (baked in so deploys only pull)
      # is the step most likely to fail, and then neither :latest moves.
      - name: Build and push Python image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./services/python-analytics
          push: true
          build-args: DOWNLOAD_GENRE_MODELS=true
          tags: ${{ env.PYTHON_IMAGE }}:${{ github.sha }},${{ env.PYTHON_IMAGE }}:latest

      - name: Build and push Go image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: ./services/go-api-server/Dockerfile
          push: true
          tags: ${{ env.GO_IMAGE }}:${{ github.sha }},${{ env.GO_IMAGE }}:latest
