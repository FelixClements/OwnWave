name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - '**'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint Go
        run: |
          cd services/go-api-server
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go files are not formatted:"
            gofmt -l .
            exit 1
          fi
          go vet ./...

      - name: Test Go (unit)
        run: cd services/go-api-server && go test ./...

      - name: Test Go (integration)
        run: |
          cd services/go-api-server
          go test -tags=integration ./internal/playback/...
          go test -tags=integration ./internal/auth/...

      - name: Test frontend
        run: |
          cd apps/t3-web-frontend
          npm ci
          npm test

      - name: Build frontend
        run: |
          cd apps/t3-web-frontend
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Python analytics
        run: |
          cd services/python-analytics
          grep -v '^essentia' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt pytest
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres \
          DATABASE_URL=postgres://unused@localhost/unused PYTHONPATH=src pytest -q tests

      - name: Build Docker images
        env:
          DOWNLOAD_GENRE_MODELS: "false"
        run: docker compose build

  publish:
    if: github.ref == 'refs/heads/main'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "GO_IMAGE=ghcr.io/${repo}/go" >> $GITHUB_ENV
          echo "PYTHON_IMAGE=ghcr.io/${repo}/python" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Python first: its genre model download (baked in so deploys only pull)
      # is the step most likely to fail, and then neither :latest moves.
      - name: Build and push Python image
        uses: docker/build-push-action@v5
        with:
          context: ./services/python-analytics
          push: true
          build-args: DOWNLOAD_GENRE_MODELS=true
          tags: ${{ env.PYTHON_IMAGE }}:${{ github.sha }},${{ env.PYTHON_IMAGE }}:latest

      - name: Build and push Go image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/go-api-server/Dockerfile
          push: true
          tags: ${{ env.GO_IMAGE }}:${{ github.sha }},${{ env.GO_IMAGE }}:latest
