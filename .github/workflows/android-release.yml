name: Android release

# Push a tag like android-v0.2.0 to build a signed release APK and attach it to a GitHub Release.
# versionName comes from the tag, versionCode from this workflow's run number, so it only grows.
on:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG#android-v}"
          if ! [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like android-v1.2.3, got $TAG"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build, test and sign
        env:
          OWNWAVE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OWNWAVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OWNWAVE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OWNWAVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :app:testDebugUnitTest :app:assembleRelease
          -Pownwave.versionName=${{ steps.version.outputs.name }}
          -Pownwave.versionCode=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ownwave-${{ steps.version.outputs.name }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --title "OwnWave for Android ${{ steps.version.outputs.name }}"
          --notes "Signed APK for Android 9 and newer. Install steps: apps/android/README.md."
