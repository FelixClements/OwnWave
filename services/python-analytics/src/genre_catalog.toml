# Genre catalog for the genre engine v2 (ADR 0008, glossary in CONTEXT.md).
#
# The genre list the owner approved on 2026-11-25 (issue #138), from the
# offline run on a copy of the live library.
# Edit this file, not the code: genre_catalog.py reads it, and the analytics
# service writes it to station_genres at startup. The genre v2 switch
# (migration 038_genre_v2_switch) was generated from it at the release and is
# frozen; renaming or removing an id that stored data uses needs a migration.
#
# Two levels:
#   genre  A station-sized kind of music (House). Listed in display order.
#   style  A narrower kind inside exactly one genre (Deep House). Styles are
#          Discogs styles.
#
# [[genre]] keys:
#   id        Stable id (lowercase, a-z0-9_, starts with a letter, max 40).
#   name      Display name.
#   station   false: never offered as a station (default true).
#   replaces  Old (v1) station genre ids whose user data moves to this genre
#             at the switch. Every v1 id must appear exactly once.
#   discogs   Discogs styles that stand for the genre as a whole, such as
#             "Techno" for Techno. They give the genre without a style.
#   styles    The genre's styles. A plain string is a Discogs style name and
#             also the style's display name. An inline table
#             { name = "...", discogs = ["..."] } names the style and lists
#             the Discogs styles it stands for.
#
# A Discogs style written "Parent---Style" (the Discogs400 label form) only
# matches under that Discogs genre. Use it when one Discogs style name means
# different things under two Discogs genres (Electronic Hardcore is hard
# dance, Rock Hardcore is punk). Without the Discogs genre such a name is
# ambiguous and only fences.
#
# Style ids are made from the style name (Deep House -> deep_house) and may
# not equal a genre id.

version = "2026-11-25"

[[genre]]
id = "techno"
name = "Techno"
replaces = ["techno"]
discogs = ["Techno"]
styles = ["Acid", "Bleep", "Deep Techno", "Dub Techno", "Hard Techno", "Minimal", "Minimal Techno", "Schranz", "Tribal"]

[[genre]]
id = "house"
name = "House & Disco"
# Dance & Disco merged in (#138, owner approved 2026-11-25): on its own it had
# 37 songs and the classifier never got its labels right.
replaces = ["house", "dance"]
discogs = ["House"]
styles = [
    "Acid House", "Beatdown", "Deep House", "Disco", "Disco Polo", "Electro House", "Euro House",
    "Euro-Disco", "Eurobeat", "Eurodance", "Freestyle", "Garage House", "Ghetto House", "Hands Up",
    "Hard House", "Hi NRG", "Hip-House", "Italo House", "Italo-Disco", "Italodance", "New Beat",
    "Nu-Disco", "Progressive House", "Tech House", "Tribal House", "Tropical House",
]

[[genre]]
id = "trance"
name = "Trance"
replaces = ["trance"]
discogs = ["Trance"]
styles = ["Goa Trance", "Hard Trance", "Progressive Trance", "Psy-Trance", "Tech Trance"]

[[genre]]
id = "drum_and_bass"
name = "Drum & Bass and Bass Music"
# Bass & Breaks merged in (#138, owner approved 2026-11-25). Drum n Bass is a
# style here, not the genre as a whole: the style pick takes the strongest
# Discogs400 style inside the genre, and without it most D&B songs got
# Dubstep or Halftime.
replaces = ["drum_and_bass", "bass"]
styles = [
    "Bass Music", "Bassline", "Big Beat", "Breakbeat", "Breaks", "Broken Beat", "Drum n Bass", "Dubstep",
    "Ghetto", "Grime", "Halftime", "Juke", "Jungle", "Progressive Breaks", "Speed Garage", "UK Garage",
]

