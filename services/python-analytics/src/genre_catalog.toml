# --- Per-source extras ------------------------------------------------------------
# Last.fm tags are folksonomy: these extra tags are ignored there only.
[lastfm]
ignore = [
    "british", "american", "german", "french", "love", "beautiful", "awesome",
    "mellow", "party", "oldies", "classic", "cover", "covers", "live", "remix", "soundtrack of my life",
]
