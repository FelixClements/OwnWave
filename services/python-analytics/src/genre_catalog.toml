# Genre catalog for the genre engine v2 (ADR 0008, glossary in CONTEXT.md).
#
# DRAFT. The owner approves the final list after the offline run (issue #138).
# Edit this file, not the code: genre_catalog.py reads it, and
#   python services/python-analytics/src/genre_catalog.py
# regenerates the switch migration in database/genre-v2/ from it.
#
# Two levels:
#   genre  A station-sized kind of music (House). Listed in display order.
#   style  A narrower kind inside exactly one genre (Deep House). Styles are
#          Discogs styles.
#
# [[genre]] keys:
#   id        Stable id (lowercase, a-z0-9_, starts with a letter, max 40).
#   name      Display name.
#   station   false: never offered as a station (default true).
#   replaces  Old (v1) station genre ids whose user data moves to this genre
#             at the switch. Every v1 id must appear exactly once.
#   discogs   Discogs styles that stand for the genre as a whole, such as
#             "Techno" for Techno. They give the genre without a style.
#   styles    The genre's styles. A plain string is a Discogs style name and
#             also the style's display name. An inline table
#             { name = "...", discogs = ["..."] } names the style and lists
#             the Discogs styles it stands for.
#
# A Discogs style written "Parent---Style" (the Discogs400 label form) only
# matches under that Discogs genre. Use it when one Discogs style name means
# different things under two Discogs genres (Electronic Hardcore is hard
# dance, Rock Hardcore is punk). Without the Discogs genre such a name is
# ambiguous and only fences.
#
# Style ids are made from the style name (Deep House -> deep_house) and may
# not equal a genre id.

version = "draft-2026-11-24"

