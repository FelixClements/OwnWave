# Patterns are Python regular expressions over the folded text.
[[text.rule]]
# Before everything else: "Industrial Metal", "Drone Metal", "Rap Metal" and
# "Trap Metal" are metal, not experimental, ambient or hip hop.
pattern = 'metal|thrash|grindcore|djent|deathcore|goregrind'
genre = "metal"

[[text.rule]]
pattern = 'drum ?(n|and|n n) ?bass|\bdnb\b|\bd and b\b|jungle|liquid funk|neurofunk'
genre = "drum_and_bass"

[[text.rule]]
pattern = 'hardstyle|gabber|happy hardcore|hardcore techno|frenchcore|hard dance|jumpstyle|speedcore|uptempo'
genre = "hard_dance"

[[text.rule]]
pattern = 'techno|schranz|^minimal$'
genre = "techno"

[[text.rule]]
pattern = 'house|big room'
genre = "house"

[[text.rule]]
pattern = 'trance|\bpsy\b|\bgoa\b'
genre = "trance"

[[text.rule]]
# "Garage Rock" and "Garage Punk" are not UK garage.
pattern = 'dubstep|breakbeat|\bbreaks\b|uk garage|\bgarage\b(?! rock| punk)|grime|bass music|riddim|future bass|bassline'
genre = "bass"

[[text.rule]]
pattern = 'disco|eurodance|eurobeat|hi ?nrg|italo'
genre = "dance"

[[text.rule]]
pattern = 'synth ?pop|synthwave|darkwave|\belectro\b|electroclash|new wave|\bebm\b|vaporwave|retrowave|chiptune'
genre = "synth"

[[text.rule]]
pattern = 'ambient|chill|downtempo|new age|trip ?hop|drone'
genre = "ambient"

[[text.rule]]
pattern = 'experimental|\bidm\b|glitch|noise|industrial|avant'
genre = "experimental"

[[text.rule]]
pattern = 'hip ?hop|\brap\b|\btrap\b|\bdrill\b|boom bap|\bg funk\b'
genre = "hip_hop"

[[text.rule]]
pattern = '\br and b\b|\brnb\b|rhythm and blues|soul|funk|motown|gospel|new jack'
