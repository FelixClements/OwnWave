name = "Hard Dance"
replaces = ["hard_dance"]
styles = [
    { name = "Hardcore", discogs = ["Electronic---Hardcore"] },
    "Donk", "Gabber", "Happy Hardcore", "Hardstyle", "Jumpstyle", "Makina", "Speedcore",
]

