"club" = ["techno", "house", "trance", "drum_and_bass", "hard_dance"]
"pop rock" = ["pop", "asian_pop", "rock", "metal", "punk"]
"rock pop" = ["pop", "asian_pop", "rock", "metal", "punk"]
"alternative" = ["rock", "punk", "metal"]
"alt" = ["rock", "punk", "metal"]
"alternative and punk" = ["rock", "punk", "metal"]
"hardcore" = ["hard_dance", "punk"]
"progressive" = ["house", "trance", "rock", "metal"]
"urban" = ["hip_hop", "soul"]
