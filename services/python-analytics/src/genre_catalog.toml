# --- Discogs genres -------------------------------------------------------------
# A Discogs genre (the part before "---") names only a wide area: it fences a
# song to these genres. Every Discogs style under it must land inside.
[discogs_genres]
"Blues" = ["blues", "soul"]
"Brass & Military" = ["other"]
"Children's" = ["other"]
"Classical" = ["classical"]
"Electronic" = [
    "techno", "house", "trance", "drum_and_bass", "hard_dance", "synth", "ambient", "experimental",
    "pop", "hip_hop", "jazz", "latin", "folk", "reggae",
]
"Folk, World, & Country" = ["folk", "world", "soul"]
"Funk / Soul" = ["soul", "house", "world"]
"Hip Hop" = ["hip_hop", "drum_and_bass", "ambient", "soul", "synth"]
"Jazz" = ["jazz", "world", "latin"]
"Latin" = ["latin"]
"Non-Music" = ["other"]
"Pop" = ["pop", "asian_pop", "rock"]
"Reggae" = ["reggae", "world"]
"Rock" = ["rock", "metal", "punk", "synth", "experimental", "folk", "reggae", "pop", "jazz"]
"Stage & Screen" = ["soundtrack"]

# --- Free text: file genre tags, MusicBrainz genres, Last.fm tags ------------------
# Text is compared in a folded form: lowercase, accents removed, "&" read as
# "and", other punctuation as a space ("Hip-Hop" -> "hip hop").
# Checked in this order; the first that matches wins:
#   1. ignore   Not a genre, or too vague to mean anything.
#   2. broad    A broad tag: fences the song to these genres, picks none.
#   3. aliases  Text -> style name or genre id.
#   4. style names, their Discogs names, genre ids and names, genre Discogs names.
#   5. rules    Regular expressions over the folded text, in order.
[text]
ignore = [
    "other", "others", "misc", "miscellaneous", "unknown", "various", "none", "genre", "default",
    "instrumental", "vocal", "acoustic", "contemporary", "modern", "beat", "abstract", "tribal",
    "psychedelic", "conscious", "romantic", "modal", "fusion", "political", "religious", "education",
    "educational", "story", "theme", "ghetto", "bounce", "screw", "gangsta", "novelty", "son", "mod",
    "interview", "dialogue", "promotional", "monolog", "pacific", "seen live", "favorites",
    "favourites", "female vocalists", "male vocalists", "christmas", "holiday",
]

[text.broad]
"electronic" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth", "ambient", "experimental"]
"electronique" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth", "ambient", "experimental"]
"electronica" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth", "ambient", "experimental"]
"electronic dance music" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth"]
"dance and edm" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth"]
"edm" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth"]
# "Electro" alone in file tags is used for synthwave, techno, EDM and electro
# alike (#138), so it only fences. Discogs' Electro style still names Synth.
"electro" = ["synth", "techno", "house", "trance", "drum_and_bass", "hard_dance"]
"electro dance" = ["techno", "house", "trance", "drum_and_bass", "hard_dance", "synth"]
