<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Station cover placeholders</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #121212;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      padding: 3rem 1rem;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { color: #b3b3b3; margin: 0 0 1.5rem; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }
    .card {
      width: 240px;
      text-align: center;
    }
    .cover {
      width: 240px;
      height: 240px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 24px rgba(0,0,0,0.35);
      margin-bottom: 1rem;
    }
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background-image:
        radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4) 0 8%, transparent 9%),
        radial-gradient(circle at 70% 70%, rgba(255,255,255,0.25) 0 12%, transparent 13%);
      background-size: 48px 48px;
    }
    .initials {
      font-size: 5rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 4px 16px rgba(0,0,0,0.35);
      z-index: 1;
    }
    .label { font-size: 1.1rem; font-weight: 600; }
    .sub { font-size: 0.85rem; color: #b3b3b3; }
  </style>
</head>
<body>
  <h1>Station cover placeholders</h1>
  <p>Deterministic from the station name. No images, no API calls.</p>
  <div class="grid">
    <div class="card" data-name="Rock Radio"></div>
    <div class="card" data-name="Techno Radio"></div>
    <div class="card" data-name="Pop Radio"></div>
  </div>

  <script>
    function hash(name) {
      return [...name].reduce((a, c) => a + c.charCodeAt(0) * 31, 0);
    }

    function render(card) {
      const name = card.dataset.name;
      const seed = hash(name);
      const hue1 = Math.abs(seed % 360);
      const hue2 = Math.abs((seed * 17) % 360);
      const initials = name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

      const cover = document.createElement('div');
      cover.className = 'cover';
      cover.style.background = `linear-gradient(135deg, hsl(${hue1} 75% 30%), hsl(${hue2} 75% 50%))`;

      const text = document.createElement('div');
      text.className = 'initials';
      text.textContent = initials;
      cover.appendChild(text);

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = name;

      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = `hsl(${hue1}°) → hsl(${hue2}°)`;

      card.appendChild(cover);
      card.appendChild(label);
      card.appendChild(sub);
    }

    document.querySelectorAll('.card').forEach(render);
  </script>
</body>
</html>
