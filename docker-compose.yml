# Shared by the python, worker and watcher services (same image, same config).
x-python: &python
  build:
    context: ./services/python-analytics
    args:
      DOWNLOAD_GENRE_MODELS: ${DOWNLOAD_GENRE_MODELS:-false}
  platform: linux/amd64
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
    REDIS_URL: redis://:${REDIS_PASSWORD:-ownwave}@redis:6379/0
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-ownwave}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-ownwave}@redis:6379/0
    ANALYTICS_API_SECRET: ${ANALYTICS_API_SECRET:-local-analytics-secret-change-me}
    MUSIC_DIR: /music
    ENABLE_GENRE_ANALYSIS: ${ENABLE_GENRE_ANALYSIS:-false}
    GENRE_MODEL_DIR: ${GENRE_MODEL_DIR:-/app/models}
    GENRE_SNIPPET_START: ${GENRE_SNIPPET_START:-30}
    GENRE_SNIPPET_DURATION: ${GENRE_SNIPPET_DURATION:-30}
    GENRE_MIN_CONFIDENCE: ${GENRE_MIN_CONFIDENCE:-0.3}
    GENRE_MIN_TRACKS_PER_STATION: ${GENRE_MIN_TRACKS_PER_STATION:-5}
    GENRE_FULL_TRACK_MODE: ${GENRE_FULL_TRACK_MODE:-false}
  volumes:
    - ${MUSIC_PATH:-./music}:/music:ro
  # go runs the database migrations, so it must be healthy first.
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    go:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ownwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ownwave}
      POSTGRES_DB: ${POSTGRES_DB:-ownwave}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ownwave} -d ${POSTGRES_DB:-ownwave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-ownwave}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-ownwave} --no-auth-warning ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  python:
    <<: *python
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *python
    command: celery -A celery_app worker -P prefork -c ${WORKER_CONCURRENCY:-2} --loglevel=info -n worker@%h

  watcher:
    <<: *python
    command: python -m main watch

  go:
    build: ./services/go-api-server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
      MUSIC_DIR: /music
      ANALYTICS_API_SECRET: ${ANALYTICS_API_SECRET:-local-analytics-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      OWNWAVE_DOMAIN: ${OWNWAVE_DOMAIN:-localhost}
      FFMPEG_PATH: ffmpeg
      PYTHON_API_URL: http://python:8000
      GENRE_MIN_CONFIDENCE: ${GENRE_MIN_CONFIDENCE:-0.3}
      GENRE_MIN_TRACKS_PER_STATION: ${GENRE_MIN_TRACKS_PER_STATION:-5}
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
      - ./database/migrations:/migrations:ro
    ports:
      - "127.0.0.1:${GO_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/t3-web-frontend
      args:
        GO_API_URL: http://go:8080
    restart: unless-stopped
    environment:
      GO_API_URL: ${GO_API_URL:-http://go:8080}
    ports:
      - "3000:3000"
    depends_on:
      - go

volumes:
  db_data:
  redis_data:
