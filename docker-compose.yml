# go and python images are published to GHCR by CI on every push to main.
# Deploy with `docker compose pull && docker compose up -d`; `--build` builds
# them from source instead. OWNWAVE_IMAGE_TAG pins a commit SHA (rollback).
#
# Required (compose refuses to start without them; see .env.example):
#   POSTGRES_PASSWORD, ANALYTICS_API_SECRET (generate: openssl rand -hex 32)

# Shared by the python (API) and worker services (same image, same config).
x-python: &python
  image: ghcr.io/felixclements/ownwave/python:${OWNWAVE_IMAGE_TAG:-latest}
  build:
    context: ./services/python-analytics
    args:
      DOWNLOAD_GENRE_MODELS: ${DOWNLOAD_GENRE_MODELS:-false}
  platform: linux/amd64
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ownwave}
    ANALYTICS_API_SECRET: ${ANALYTICS_API_SECRET:?set ANALYTICS_API_SECRET (openssl rand -hex 32)}
    MUSIC_DIR: /music
    ENABLE_GENRE_ANALYSIS: ${ENABLE_GENRE_ANALYSIS:-false}
    GENRE_MODEL_DIR: ${GENRE_MODEL_DIR:-/app/models}
    GENRE_WINDOW_SECONDS: ${GENRE_WINDOW_SECONDS:-20}
    MUSICBRAINZ_ENABLED: ${MUSICBRAINZ_ENABLED:-true}
    # TensorFlow threads per worker process (genre model). Keep
    # WORKER_CONCURRENCY x TF_NUM_INTRAOP_THREADS near the CPU count.
    TF_NUM_INTRAOP_THREADS: ${TF_NUM_INTRAOP_THREADS:-3}
    TF_NUM_INTEROP_THREADS: ${TF_NUM_INTEROP_THREADS:-1}
  volumes:
    - ${MUSIC_PATH:-./music}:/music:ro
  # go runs the database migrations, so it must be healthy first.
  depends_on:
    db:
      condition: service_healthy
    go:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ownwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ownwave}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Published for local tools only; services use the compose network.
    # DB_HOST_PORT is a bare port. Published ports bypass ufw, so keep
    # DB_BIND_ADDR on loopback unless you know you need otherwise.
    ports:
      - "${DB_BIND_ADDR:-127.0.0.1}:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ownwave} -d ${POSTGRES_DB:-ownwave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  python:
    <<: *python
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Runs queued scans and analysis (claimed from Postgres) and watches the
  # music folder. Keep a single worker service: on start it requeues tasks
  # that were running, which assumes no other worker holds them.
  worker:
    <<: *python
    command: python -m main worker -c ${WORKER_CONCURRENCY:-4}

  # API under /api plus the static web UI at /.
  go:
    image: ghcr.io/felixclements/ownwave/go:${OWNWAVE_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: services/go-api-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ownwave}
      MUSIC_DIR: /music
      ANALYTICS_API_SECRET: ${ANALYTICS_API_SECRET:?set ANALYTICS_API_SECRET (openssl rand -hex 32)}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      OWNWAVE_DOMAIN: ${OWNWAVE_DOMAIN:-localhost}
      # Secure session cookie + HSTS. Empty = on when PUBLIC_APP_URL is https.
      OWNWAVE_COOKIE_SECURE: ${OWNWAVE_COOKIE_SECURE:-}
      # Proxies whose X-Forwarded-For is believed (empty = private networks).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FFMPEG_PATH: ffmpeg
      PYTHON_API_URL: http://python:8000
      # Transcoded files (Opus/AAC qualities), least recently played evicted first.
      TRANSCODE_CACHE_MB: ${TRANSCODE_CACHE_MB:-10240}
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
      - transcode_cache:/cache
    ports:
      - "${GO_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  transcode_cache:
