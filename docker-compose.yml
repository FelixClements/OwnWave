services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ownwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ownwave}
      POSTGRES_DB: ${POSTGRES_DB:-ownwave}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ownwave} -d ${POSTGRES_DB:-ownwave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}?sslmode=disable
    command: ["up"]
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  python:
    build: ./services/python-analytics
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MUSIC_DIR: /music
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./services/python-analytics
    command: celery -A celery_app worker -P gevent -c 50 --loglevel=info -n worker@%h
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MUSIC_DIR: /music
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  watcher:
    build: ./services/python-analytics
    command: python -m main watch
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MUSIC_DIR: /music
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  go:
    build: ./services/go-api-server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
      MUSIC_DIR: /music
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FFMPEG_PATH: ffmpeg
      PYTHON_API_URL: http://python:8000
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/t3-web-frontend
    environment:
      NEXT_PUBLIC_GO_API_URL: ${NEXT_PUBLIC_GO_API_URL:-http://localhost:8080}
      GO_API_URL: ${GO_API_URL:-http://go:8080}
    ports:
      - "3000:3000"
    depends_on:
      - go

volumes:
  db_data:
  redis_data:
