# Shared by the python (API) and worker services (same image, same config).
x-python: &python
  build:
    context: ./services/python-analytics
    args:
      DOWNLOAD_GENRE_MODELS: ${DOWNLOAD_GENRE_MODELS:-false}
  platform: linux/amd64
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
    ANALYTICS_API_SECRET: ${ANALYTICS_API_SECRET:-local-analytics-secret-change-me}
    MUSIC_DIR: /music
    ENABLE_GENRE_ANALYSIS: ${ENABLE_GENRE_ANALYSIS:-false}
    GENRE_MODEL_DIR: ${GENRE_MODEL_DIR:-/app/models}
    GENRE_SNIPPET_START: ${GENRE_SNIPPET_START:-30}
    GENRE_SNIPPET_DURATION: ${GENRE_SNIPPET_DURATION:-30}
    GENRE_MIN_CONFIDENCE: ${GENRE_MIN_CONFIDENCE:-0.3}
    GENRE_MIN_TRACKS_PER_STATION: ${GENRE_MIN_TRACKS_PER_STATION:-5}
    GENRE_FULL_TRACK_MODE: ${GENRE_FULL_TRACK_MODE:-false}
  volumes:
    - ${MUSIC_PATH:-./music}:/music:ro
  # go runs the database migrations, so it must be healthy first.
  depends_on:
    db:
      condition: service_healthy
    go:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ownwave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ownwave}
      POSTGRES_DB: ${POSTGRES_DB:-ownwave}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ownwave} -d ${POSTGRES_DB:-ownwave}"]
      interval: 5s
      timeout: 5s
      retries: 5

  python:
    <<: *python
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Runs queued scans and analysis (claimed from Postgres) and watches the
  # music folder. Keep a single worker service: on start it requeues tasks
  # that were running, which assumes no other worker holds them.
  worker:
    <<: *python
    command: python -m main worker -c ${WORKER_CONCURRENCY:-2}

  # API under /api plus the static web UI at /.
  go:
    build:
      context: .
      dockerfile: services/go-api-server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ownwave}:${POSTGRES_PASSWORD:-ownwave}@db:5432/${POSTGRES_DB:-ownwave}
      MUSIC_DIR: /music
      ANALYTICS_API_SECRET: ${ANALYTICS_API_SECRET:-local-analytics-secret-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      OWNWAVE_DOMAIN: ${OWNWAVE_DOMAIN:-localhost}
      FFMPEG_PATH: ffmpeg
      PYTHON_API_URL: http://python:8000
      GENRE_MIN_CONFIDENCE: ${GENRE_MIN_CONFIDENCE:-0.3}
      GENRE_MIN_TRACKS_PER_STATION: ${GENRE_MIN_TRACKS_PER_STATION:-5}
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
      - ./database/migrations:/migrations:ro
    ports:
      - "${GO_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
