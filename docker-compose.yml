services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ownwave
      POSTGRES_PASSWORD: ownwave
      POSTGRES_DB: ownwave
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ownwave -d ownwave"]
      interval: 5s
      timeout: 5s
      retries: 5

  python:
    build: ./services/python-analytics
    environment:
      DATABASE_URL: postgres://ownwave:ownwave@db:5432/ownwave
      MUSIC_DIR: /music
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  go:
    build: ./services/go-api-server
    environment:
      DATABASE_URL: postgres://ownwave:ownwave@db:5432/ownwave
      MUSIC_DIR: /music
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FFMPEG_PATH: ffmpeg
      PYTHON_API_URL: http://python:8000
    volumes:
      - ${MUSIC_PATH:-./music}:/music:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/t3-web-frontend
    environment:
      NEXT_PUBLIC_GO_API_URL: http://localhost:8080
      GO_API_URL: http://go:8080
    ports:
      - "3000:3000"
    depends_on:
      - go

volumes:
  db_data:
